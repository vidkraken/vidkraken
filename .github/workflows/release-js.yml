name: Release npm package

# Publishes js/ to npm with trusted publishing (OIDC, no npm token): npm
# trusts this workflow + the "npm" environment for the vidkraken package,
# and attaches provenance. Bump js/package.json and js/src/version.ts, then
# run this workflow or push a js-v<version> tag.

on:
  workflow_dispatch:
  push:
    tags: ["js-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/vidkraken
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public
