[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vidkraken"
dynamic = ["version"]
description = "Official Python SDK and CLI for the Vid Kraken YouTube download API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vid Kraken", email = "hello@vidkraken.com" }]
keywords = [
  "vidkraken",
  "youtube",
  "youtube-downloader",
  "video",
  "audio",
  "mp3",
  "download",
  "api",
  "sdk",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=5", "mypy>=1.8"]

[project.urls]
Homepage = "https://vidkraken.com"
Documentation = "https://vidkraken.com/docs"
Source = "https://github.com/vidkraken/vidkraken"
Issues = "https://github.com/vidkraken/vidkraken/issues"

[project.scripts]
vidkraken = "vidkraken.cli:main"

[tool.hatch.version]
path = "src/vidkraken/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vidkraken"]

[tool.hatch.build.targets.sdist]
include = ["src/vidkraken", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/vidkraken"]
